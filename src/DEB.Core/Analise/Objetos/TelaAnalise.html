<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modelo de análise</title>
<style>
/* Janela do modelo de análise do PCEB (D46): objetos | vista 3D | dados da seleção, na identidade mata e ipê. Sem rede. */
:root{
  --ok:#2f6b3f; --conf:#b07a12; --nao:#9b2c1f;
  --mata:#123a2c; --mata-claro:#e7efe9; --ipe:#e3a92b; --ocre:#8a5a00; --anil:#1d3f6e; --erro:#9b2c1f;
  --papel:#f2f1ec; --tinta:#13201a; --suave:#5d665f; --linha:#d9d7cf; --branco:#ffffff;
  --bg:var(--papel); --fg:var(--tinta); --card:var(--branco); --campo:#fbfaf7;
  --c-pilar:#123a2c; --c-viga:#1d3f6e; --c-lig:#b07a12; --c-vinc:#8a8f88; --c-sel:#e3a92b; --c-def:#9b2c1f; --c-diag:#1d3f6e; --c-carga:#9b2c1f;
  --f-titulo:"Segoe UI Semibold","Segoe UI",system-ui,sans-serif; --f-texto:"Segoe UI",system-ui,sans-serif; --f-dado:Consolas,"Cascadia Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a15; --fg:#e8ece6; --card:#16241d; --campo:#1b2c23; --linha:#2c3d34; --suave:#a3ada5; --mata-claro:#1f3a2e;
  --c-pilar:#7fc48f; --c-viga:#8fb3e8; --c-lig:#e3a92b; --c-vinc:#a3ada5; --c-def:#f08a7a; --c-diag:#8fb3e8; --c-carga:#f08a7a; --ok:#7fc48f; --conf:#e3a92b; --nao:#f08a7a; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a15; --fg:#e8ece6; --card:#16241d; --campo:#1b2c23; --linha:#2c3d34; --suave:#a3ada5; --mata-claro:#1f3a2e;
  --c-pilar:#7fc48f; --c-viga:#8fb3e8; --c-lig:#e3a92b; --c-vinc:#a3ada5; --c-def:#f08a7a; --c-diag:#8fb3e8; --c-carga:#f08a7a; --ok:#7fc48f; --conf:#e3a92b; --nao:#f08a7a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-texto);font-size:13.5px;line-height:1.45}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.topo{background:var(--mata);color:#fff;display:flex;align-items:center;gap:14px;padding:9px 14px;flex-wrap:wrap}
.topo .nome{font-family:var(--f-titulo);font-size:1.05rem}
.topo .sub{color:#c9d6cd;font-size:.8rem}
.topo .esp{flex:1}
.topo select{background:#1d4a39;color:#fff;border:1px solid #3d6252;border-radius:5px;padding:4px 8px;font:inherit}
.barra{display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--linha);flex-wrap:wrap;background:var(--card)}
.seg{display:flex;border:1px solid var(--linha);border-radius:6px;overflow:hidden}
.seg button{background:var(--card);color:var(--fg);border:0;border-right:1px solid var(--linha);padding:4px 9px;font:inherit;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--mata);color:#fff}
.barra select,.barra input[type=range]{font:inherit}
.barra select{padding:4px 6px;border:1px solid var(--linha);border-radius:5px;background:var(--campo);color:var(--fg)}
.filtro{display:flex;gap:5px;align-items:center;color:var(--suave);font-size:.84rem}
.btn{border:1px solid var(--linha);background:var(--card);color:var(--fg);font:inherit;font-size:.84rem;padding:5px 10px;border-radius:5px;cursor:pointer}
.btn.prim{background:var(--mata);color:#fff;border-color:var(--mata)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ipe);outline-offset:1px}
.corpo{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;min-height:0}
.lista{border-right:1px solid var(--linha);background:var(--campo);overflow:auto;padding:8px}
.lista h4{margin:10px 4px 4px;font-family:var(--f-titulo);font-weight:600;font-size:.86rem;color:var(--suave);display:flex;align-items:center;gap:6px}
.lista h4 i{width:12px;height:4px;border-radius:2px;display:inline-block}
.obj{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--fg);font:inherit;font-size:.86rem;padding:5px 8px;border-radius:5px;cursor:pointer}
.obj:hover{background:var(--mata-claro)}
.obj[aria-current="true"]{background:var(--mata);color:#fff}
.vista{position:relative;min-width:0;min-height:0;background:var(--card)}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.arrastando{cursor:grabbing}
.legenda{position:absolute;left:12px;bottom:10px;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--linha);border-radius:6px;padding:6px 10px;font-size:.78rem;display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 24px)}
.legenda span{display:flex;align-items:center;gap:5px}
.legenda i{width:16px;height:4px;border-radius:2px;display:inline-block}
.legenda i.rampa{width:150px;height:10px;border-radius:3px;background:linear-gradient(90deg,#2c7fb8,#41b6c4,#fdae61,#d7191c,#7f0000)}
.dica{position:absolute;right:12px;top:8px;font-size:.74rem;color:var(--suave);pointer-events:none}
.lateral{border-left:1px solid var(--linha);background:var(--campo);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.lateral h4{margin:0 0 4px;font-family:var(--f-titulo);font-weight:600;font-size:.9rem}
.vazio{color:var(--suave);font-size:.86rem}
table{border-collapse:collapse;width:100%;font-size:.8rem}
th,td{padding:3px 5px;border-bottom:1px solid var(--linha);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--suave);font-weight:600}
td{font-family:var(--f-dado)}
.avisos{font-size:.8rem;color:var(--ocre);display:grid;gap:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.82rem}
.kv b{font-weight:500;color:var(--suave)}
.kv span{font-family:var(--f-dado)}
.abas{position:absolute;left:12px;top:8px;z-index:2}
#cv2{display:none;cursor:default}
.vista.v2d #cv{display:none}.vista.v2d #cv2{display:block}
.ponto{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:1px}
.selo{display:inline-block;font-size:.72rem;padding:0 7px;border-radius:9px;color:#fff;white-space:nowrap}
.verif td{font-family:var(--f-texto);white-space:normal;text-align:left;vertical-align:top}
.verif td.v{font-family:var(--f-dado)}
details{font-size:.8rem}details summary{cursor:pointer;color:var(--suave)}
details p{margin:4px 0}
@media (max-width:1000px){.corpo{grid-template-columns:190px minmax(0,1fr)}.lateral{display:none}}
@media (max-width:640px){.corpo{grid-template-columns:1fr;grid-template-rows:auto minmax(320px,1fr)}.lista{border-right:0;border-bottom:1px solid var(--linha);max-height:150px}}
</style>
</head>
<body>
<div class="app">
  <div class="topo">
    <div><div class="nome">Modelo de análise</div><div class="sub" id="titulo">análise por objetos (D46)</div></div>
    <div class="esp"></div>
    <label style="display:flex;gap:6px;align-items:center;font-size:.84rem">Resultado <select id="resultado" aria-label="Caso ou combinação"></select></label>
  </div>
  <div class="barra">
    <div class="seg" role="group" aria-label="O que mostrar">
      <button type="button" data-modo="modelo" aria-pressed="true">Modelo</button>
      <button type="button" data-modo="deformada" aria-pressed="false">Deformada</button>
      <button type="button" data-modo="diagrama" aria-pressed="false">Diagrama</button>
      <button type="button" data-modo="mapa" aria-pressed="false">Mapa de cores</button>
      <button type="button" data-modo="situacao" aria-pressed="false">Situação</button>
    </div>
    <select id="esforco" aria-label="Esforço">
      <option value="M" title="Momentos fletores My e Mz">Momentos (My, Mz)</option><option value="V">Cortantes (Vy, Vz)</option>
      <option value="N">Normal</option><option value="T">Torção</option>
    </select>
    <select id="grandezaLaje" aria-label="Grandeza da laje" hidden>
      <option value="mx">mx · momento (kN·m/m)</option><option value="my">my · momento (kN·m/m)</option>
      <option value="uz">uz · flecha (mm)</option><option value="mxy">mxy · torção (kN·m/m)</option>
    </select>
    <label class="filtro" id="rotEscala">escala <input type="range" id="escala" min="0.2" max="5" step="0.1" value="1"></label>
    <label class="filtro"><input type="checkbox" id="verCargas" checked> cargas</label>
    <label class="filtro"><input type="checkbox" id="verNomes"> nomes</label>
    <div class="seg" role="group" aria-label="Vista">
      <button type="button" data-vista="iso">3D</button><button type="button" data-vista="xy">Planta</button>
      <button type="button" data-vista="xz">Elev. XZ</button><button type="button" data-vista="yz">Elev. YZ</button>
    </div>
    <button class="btn" type="button" id="ajustar">Ajustar</button>
    <span style="flex:1"></span>
    <button class="btn prim" type="button" id="fechar">Fechar</button>
  </div>
  <div class="corpo">
    <nav class="lista" id="lista" aria-label="Objetos"></nav>
    <div class="vista" id="vista"><div class="seg abas" role="group" aria-label="Vista">
        <button type="button" data-aba="3d" aria-pressed="true">3D</button><button type="button" data-aba="peca" aria-pressed="false">2D da peça</button><button type="button" data-aba="laje" aria-pressed="false">Laje · isovalores</button>
      </div><canvas id="cv" aria-label="Vista 3D do modelo de análise"></canvas><canvas id="cv2" aria-label="Vista 2D"></canvas><div class="legenda" id="legenda"></div><div class="dica">arrastar: girar · Shift/botão direito: mover · roda: zoom · clique: selecionar</div></div>
    <aside class="lateral" id="lateral"><div><h4>Seleção</h4><div class="vazio">Clique numa barra ou num objeto da lista.</div></div></aside>
  </div>
</div>
<script>
"use strict";
const host = window.chrome && window.chrome.webview;
const $ = id => document.getElementById(id);
let D = null, R = null, modo = "modelo", sel = null, selBarra = -1, aba = "3d";
const cv2 = $("cv2"), ctx2 = cv2.getContext("2d");
const corSit = t => t === "Ok" ? css("--ok") : t === "NaoAtende" ? css("--nao") : css("--conf");
const nomeSit = t => t === "Ok" ? "OK" : t === "NaoAtende" ? "Não atende" : "Conferir";
const dimDe = chave => (D.dimensionamento || []).find(x => x.chave === chave);
const cam = { az: -0.95, el: 0.5, zoom: 1, alvo: [0, 0, 0], esc: 1 };
const cv = $("cv"), ctx = cv.getContext("2d");
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const NOMES = ["", "N", "Vy", "Vz", "T", "My", "Mz"];
// componentes desenhadas por esforço: [índice na estação, eixo local ("z" ou "y"), sinal]. Momento do lado tracionado:
// +My traciona +z; +Mz traciona −y (convenção vetorial dos resultados)
const COMP = { M: [[5, "z", 1], [6, "y", -1]], V: [[3, "z", 1], [2, "y", 1]], N: [[1, "z", 1]], T: [[4, "y", 1]] };
const ROTULO = { M: "momentos (lado tracionado)", V: "cortantes", N: "força normal (tração +)", T: "torção" };
const intensidade = (s, e) => Math.hypot(...COMP[e].map(c => s[c[0]]));
const ehMomento = k => k >= 4;
const fmt = (v, c = 1) => (Math.abs(v) < 1e-9 ? 0 : v).toLocaleString("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c });
const valor = (k, v) => ehMomento(k) ? fmt(v / 100, 2) + " kN·m" : fmt(v, 2) + " kN";

function enviar(m) { if (host) host.postMessage(JSON.stringify(m)); }
function receber(txt) {
  const m = typeof txt === "string" ? JSON.parse(txt) : txt;
  if (m.tipo === "modelo") { D = m; iniciar(); }
  else if (m.tipo === "aviso") alert(m.texto);
}
if (host) host.addEventListener("message", ev => receber(ev.data));

// ---------------------------------------------------------------- dados
function iniciar() {
  $("titulo").textContent = D.titulo || "análise por objetos (D46)";
  const s = $("resultado"); s.textContent = "";
  D.resultados.forEach((r, i) => { const o = document.createElement("option"); o.value = i; o.textContent = (r.tipo === "caso" ? "Caso " : "") + r.nome; s.append(o); });
  const elu = D.resultados.findIndex(r => r.tipo === "ELU"); s.value = elu >= 0 ? elu : 0;
  R = D.resultados[+s.value];
  lista(); ajustar(); lateral(); desenhar();
  // #diagrama, #mapa, #deformada: abre no modo (prévia e autoteste)
  const h = location.hash.slice(1); if (h) { const b = document.querySelector(`[data-modo="${h}"]`) || document.querySelector(`[data-aba="${h}"]`); if (b) b.click(); }
}
const cor = t => t === "Pilar" ? css("--c-pilar") : t === "Viga" ? css("--c-viga") : t === "Ligacao" ? css("--c-lig") : t === "Laje" ? "#7a8f86" : css("--c-vinc");

function lista() {
  const l = $("lista"); l.textContent = "";
  const grupos = [["Pilar", "Pilares"], ["Viga", "Vigas"], ["Laje", "Lajes"], ["Ligacao", "Ligações"]];
  for (const [t, nome] of grupos) {
    const objs = D.objetos.filter(o => o.tipo === t);
    if (!objs.length) continue;
    const h = document.createElement("h4"); const i = document.createElement("i"); i.style.background = cor(t); h.append(i, `${nome} (${objs.length})`); l.append(h);
    for (const o of objs) {
      const b = document.createElement("button"); b.className = "obj"; b.type = "button"; b.title = o.resumo;
      const dm = dimDe(o.chave); if (dm) { const pt = document.createElement("span"); pt.className = "ponto"; pt.style.background = corSit(dm.situacao); pt.title = nomeSit(dm.situacao); b.append(pt); }
      b.append(o.nome);
      b.setAttribute("aria-current", sel === o.chave ? "true" : "false");
      b.addEventListener("click", () => { sel = sel === o.chave ? null : o.chave; selBarra = -1; lista(); lateral(); desenhar(); });
      b.addEventListener("dblclick", () => { sel = o.chave; focar(o.chave); });
      l.append(b);
    }
  }
  if (D.avisos && D.avisos.length) {
    const h = document.createElement("h4"); h.textContent = "Avisos"; l.append(h);
    const d = document.createElement("div"); d.className = "avisos"; D.avisos.forEach(a => { const x = document.createElement("div"); x.textContent = a; d.append(x); }); l.append(d);
  }
}

// ---------------------------------------------------------------- projeção
function eixosCam() {
  const ca = Math.cos(cam.az), sa = Math.sin(cam.az), ce = Math.cos(cam.el), se = Math.sin(cam.el);
  return { d: [ce * ca, ce * sa, se], r: [-sa, ca, 0], u: [-se * ca, -se * sa, ce] };
}
let E = eixosCam(), W = 1, H = 1, tam = 1;
function P(p) {
  const v = [p[0] - cam.alvo[0], p[1] - cam.alvo[1], p[2] - cam.alvo[2]];
  const s = cam.esc * cam.zoom;
  return [W / 2 + s * (v[0] * E.r[0] + v[1] * E.r[1] + v[2] * E.r[2]), H / 2 - s * (v[0] * E.u[0] + v[1] * E.u[1] + v[2] * E.u[2])];
}
const no = i => [D.nos[i].x, D.nos[i].y, D.nos[i].z];
function caixa(ids) {
  const pts = (ids || D.nos.map((_, i) => i)).map(no);
  const mn = [0, 1, 2].map(k => Math.min(...pts.map(p => p[k]))), mx = [0, 1, 2].map(k => Math.max(...pts.map(p => p[k])));
  return { c: mn.map((v, k) => (v + mx[k]) / 2), t: Math.max(1, Math.hypot(mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2])) };
}
function ajustar() {
  const b = caixa(); cam.alvo = b.c; tam = b.t; cam.zoom = 1;
  medir(); cam.esc = 0.8 * Math.min(W, H) / tam; desenhar();
}
function focar(chave) {
  const ids = new Set();
  D.barras.forEach(b => { if (b.dono === chave) { ids.add(b.i); ids.add(b.j); } });
  D.molas.concat(D.vinculos).forEach(b => { if (b.dono === chave) { ids.add(b.i); ids.add(b.j); } });
  if (!ids.size) return;
  const b = caixa([...ids]); cam.alvo = b.c; cam.zoom = Math.min(20, Math.max(1, 0.5 * tam / Math.max(b.t, 30)));
  lista(); lateral(); desenhar();
}
function medir() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ---------------------------------------------------------------- desenho
function linha(a, b, c, w, traco) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.setLineDash(traco || []); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); ctx.setLineDash([]); }
function seta(p, q, c) {   // de p para q (tela)
  linha(p, q, c, 1.4); const a = Math.atan2(q[1] - p[1], q[0] - p[0]), t = 7;
  ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(q[0] - t * Math.cos(a - 0.4), q[1] - t * Math.sin(a - 0.4)); ctx.lineTo(q[0] - t * Math.cos(a + 0.4), q[1] - t * Math.sin(a + 0.4)); ctx.fill();
}
// rampa visível nos dois temas (azul = pouco, vermelho escuro = muito)
const RAMPA = ["#2c7fb8", "#41b6c4", "#fdae61", "#d7191c", "#7f0000"];
function rampa(t) {
  t = Math.max(0, Math.min(1, t)) * (RAMPA.length - 1); const i = Math.min(RAMPA.length - 2, Math.floor(t)), f = t - i;
  const h = s => [1, 3, 5].map(k => parseInt(s.substr(k, 2), 16)); const a = h(RAMPA[i]), b = h(RAMPA[i + 1]);
  return `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * f)).join(",")})`;
}
const maxBarra = (ib, e) => Math.max(...R.estacoes[ib].map(s => intensidade(s, e)));
function noDesl(i, f) { const u = R.desl[i]; const p = no(i); return [p[0] + f * u[0], p[1] + f * u[1], p[2] + f * u[2]]; }

function desenhar() {
  if (!D) return;
  if (aba === "peca") return desenharPeca();
  if (aba === "laje") return desenharLaje();
  E = eixosCam(); ctx.clearRect(0, 0, W, H);
  const k = $("esforco").value, escala = +$("escala").value;
  const selecionada = b => (sel && b.dono === sel) || (selBarra >= 0 && D.barras[selBarra] === b);
  // fator da deformada: maior deslocamento = 6 % do modelo
  let fd = 0;
  if (modo === "deformada") {
    let um = Math.max(1e-12, ...R.desl.map(u => Math.hypot(u[0], u[1], u[2])));
    R.estacoes.forEach(be => be.forEach(s => um = Math.max(um, Math.hypot(s[7], s[8], s[9]))));
    fd = escala * 0.06 * tam / um;
  }
  let maxMapa = 1e-12;
  const soPecas = b => b.tipo !== "Ligacao" && b.tipo !== "Laje";
  if (modo === "mapa") D.barras.forEach((b, ib) => { if (soPecas(b)) maxMapa = Math.max(maxMapa, maxBarra(ib, k)); });

  // vínculos e molas
  D.vinculos.forEach(v => linha(P(no(v.i)), P(no(v.j)), sel && v.dono === sel ? css("--c-sel") : css("--c-vinc"), 2, [5, 4]));
  D.molas.forEach(m => {
    const a = P(no(m.i)), b = P(no(m.j)), c = sel && m.dono === sel ? css("--c-sel") : css("--c-lig");
    if (Math.hypot(b[0] - a[0], b[1] - a[1]) < 4) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(a[0], a[1], 4, 0, 7); ctx.fill(); return; }
    // zigue-zague
    ctx.strokeStyle = c; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(a[0], a[1]);
    const n = 6, dx = (b[0] - a[0]) / n, dy = (b[1] - a[1]) / n, L = Math.hypot(dx, dy) || 1, px = -dy / L * 4, py = dx / L * 4;
    for (let i = 1; i < n; i++) ctx.lineTo(a[0] + dx * i + (i % 2 ? px : -px), a[1] + dy * i + (i % 2 ? py : -py));
    ctx.lineTo(b[0], b[1]); ctx.stroke();
  });
  // barras
  D.barras.forEach((b, ib) => {
    let c = cor(b.tipo), w = b.tipo === "Pilar" ? 3 : b.tipo === "Laje" ? 1 : 2.5;
    if (modo === "situacao") { const dm = dimDe(b.dono); c = dm ? corSit(dm.situacao) : css("--c-vinc"); }
    if (modo === "mapa" && soPecas(b)) {
      // trecho a trecho pelas estações
      const est = R.estacoes[ib], pi = no(b.i), pt = s => P([0, 1, 2].map(q => pi[q] + b.ex[q] * s[0]));
      for (let n = 0; n + 1 < est.length; n++)

  // barras do objeto: esforços nas pontas
  const t = document.createElement("table");
  t.innerHTML = "<tr><th>barra · ponta</th><th>N</th><th>Vy</th><th>Vz</th><th>T</th><th>My</th><th>Mz</th></tr>";
  D.barras.forEach((b, ib) => {
    if (b.dono !== chave && ib !== selBarra) return;
    const est = R.estacoes[ib];
    for (const [rot, s] of [["I", est[0]], ["J", est[est.length - 1]]]) {
      const tr = document.createElement("tr");
      const c0 = document.createElement("td"); c0.textContent = (b.nome || "#" + ib).replace(o.nome, "").trim() + " · " + rot; tr.append(c0);
      for (let q = 1; q <= 6; q++) { const c = document.createElement("td"); c.textContent = ehMomento(q) ? fmt(s[q] / 100, 2) : fmt(s[q], 2); tr.append(c); }
      t.append(tr);
    }
  });
  if (t.rows.length > 1) { const n = document.createElement("div"); n.className = "vazio"; n.textContent = "kN e kN·m; N > 0 tração; eixos locais da barra"; sec("Esforços nas pontas · " + R.nome, t, n); }
  // reações dos apoios do objeto
  const re = R.reacoes.filter(r => D.barras.some(b => b.dono === chave && (b.i === r.no || b.j === r.no)));
  re.forEach(r => sec("Reação no apoio", kv([["Fx, Fy, Fz", r.R.slice(0, 3).map(v => fmt(v, 2)).join("; ") + " kN"], ["Mx, My, Mz", r.R.slice(3).map(v => fmt(v / 100, 2)).join("; ") + " kN·m"]])));
}
function resumoResultado(sec, kv) {
  const somaZ = R.reacoes.reduce((s, r) => s + r.R[2], 0);
  const um = Math.max(...R.desl.map(u => Math.hypot(u[0], u[1], u[2])));
  sec("Resultado · " + R.nome, kv([["nós / barras", `${D.nos.length} / ${D.barras.length}`], ["aparelhos / vínculos", `${D.molas.length} / ${D.vinculos.length}`],
    ["Σ reações verticais", fmt(somaZ, 2) + " kN"], ["maior deslocamento", fmt(um * 10, 2) + " mm"]]));
}

function escolher(px, py) {
  let melhor = -1, dist = 9;
  D.barras.forEach((b, ib) => {
    const a = P(no(b.i)), c = P(no(b.j)), dx = c[0] - a[0], dy = c[1] - a[1], L2 = dx * dx + dy * dy || 1;
    const t = Math.max(0, Math.min(1, ((px - a[0]) * dx + (py - a[1]) * dy) / L2)), d = Math.hypot(px - a[0] - t * dx, py - a[1] - t * dy);
    if (d < dist) { dist = d; melhor = ib; }
  });
  let chaveMola = null;
  D.molas.forEach(m => { const a = P(no(m.i)); if (Math.hypot(px - a[0], py - a[1]) < 7) chaveMola = m.dono; });
  if (chaveMola) { sel = chaveMola; selBarra = -1; }
  else { selBarra = melhor; sel = melhor >= 0 ? D.barras[melhor].dono : null; }
  lista(); lateral(); desenhar();
}

// ---------------------------------------------------------------- interação
let arr = null;
cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("pointerdown", e => { arr = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, mover: e.shiftKey || e.button === 2 }; cv.setPointerCapture(e.pointerId); cv.classList.add("arrastando"); });
cv.addEventListener("pointermove", e => {
  if (!arr) return;
  const dx = e.clientX - arr.x, dy = e.clientY - arr.y; arr.x = e.clientX; arr.y = e.clientY;
  if (arr.mover) { const s = cam.esc * cam.zoom; for (let c = 0; c < 3; c++) cam.alvo[c] -= (dx * E.r[c] - dy * E.u[c]) / s; }
  else { cam.az -= dx * 0.008; cam.el = Math.max(-1.55, Math.min(1.55, cam.el + dy * 0.008)); }
  desenhar();
});
cv.addEventListener("pointerup", e => {
  cv.classList.remove("arrastando");
  if (arr && Math.hypot(e.clientX - arr.x0, e.clientY - arr.y0) < 4) { const r = cv.getBoundingClientRect(); escolher(e.clientX - r.left, e.clientY - r.top); }
  arr = null;
});
cv.addEventListener("wheel", e => { e.preventDefault(); cam.zoom = Math.max(0.1, Math.min(80, cam.zoom * Math.exp(-e.deltaY * 0.0015))); desenhar(); }, { passive: false });
document.querySelectorAll("[data-modo]").forEach(b => b.addEventListener("click", () => {
  modo = b.dataset.modo; document.querySelectorAll("[data-modo]").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  $("esforco").disabled = !(modo === "diagrama" || modo === "mapa"); $("rotEscala").style.visibility = modo === "deformada" || modo === "diagrama" ? "visible" : "hidden"; desenhar();
}));
document.querySelectorAll("[data-vista]").forEach(b => b.addEventListener("click", () => {
  const v = b.dataset.vista;
  [cam.az, cam.el] = v === "xy" ? [-Math.PI / 2, Math.PI / 2 - 1e-3] : v === "xz" ? [-Math.PI / 2, 0] : v === "yz" ? [0, 0] : [-0.95, 0.5];
  desenhar();
}));
$("resultado").addEventListener("change", () => { R = D.resultados[+$("resultado").value]; lateral(); desenhar(); });
["esforco", "escala", "verCargas", "verNomes"].forEach(id => $(id).addEventListener("input", desenhar));
$("ajustar").addEventListener("click", ajustar);
document.querySelectorAll("[data-aba]").forEach(b => b.addEventListener("click", () => {
  aba = b.dataset.aba; document.querySelectorAll("[data-aba]").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  $("vista").classList.toggle("v2d", aba !== "3d"); $("grandezaLaje").hidden = aba !== "laje"; desenhar();
}));
$("grandezaLaje").addEventListener("input", desenhar);
$("fechar").addEventListener("click", () => enviar({ acao: "fechar" }));
window.addEventListener("resize", () => { medir(); desenhar(); });
$("esforco").disabled = true; $("rotEscala").style.visibility = "hidden";
medir();
if (window.DADOS_DEMO) receber(window.DADOS_DEMO); else enviar({ acao: "pronto" });
</script>
